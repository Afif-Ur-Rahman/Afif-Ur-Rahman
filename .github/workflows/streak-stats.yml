name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Run every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Run any time this file is modified
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&background=0D1117&hide_border=true&stroke=DAB025&ring=DAB025&fire=DAB025&currStreakLabel=DAB025&sideLabels=DAB025&currStreakNum=FFFFFF&sideNums=FFFFFF&dates=FFFFFF
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
